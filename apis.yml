aid: coreos
name: CoreOS
description: >-
  CoreOS was a San Francisco-based container infrastructure company founded in 2013 that built a
  lightweight, automatically-updating Linux distribution (Container Linux, originally CoreOS Linux)
  and a family of now-foundational cloud-native open source projects: etcd (the distributed key-value
  store at the heart of Kubernetes), the Quay container registry, the Tectonic enterprise Kubernetes
  platform, the rkt container engine, flannel networking, Clair image-vulnerability scanning, and
  Ignition provisioning. Red Hat acquired CoreOS in January 2018 for approximately $250 million.
  Its technologies were folded into Red Hat's portfolio — Container Linux became Red Hat CoreOS and
  the community Fedora CoreOS, Tectonic merged into OpenShift, Quay continues as Red Hat Quay, and
  etcd and rkt were donated to the Cloud Native Computing Foundation. The company no longer operates
  independently; coreos.com redirects to Red Hat OpenShift. The github.com/coreos organization remains
  active as the upstream home for Fedora CoreOS components such as Ignition, Butane, and fleetlock.
